<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <rect width="512" height="512" rx="80" fill="#0d1117"/>
  <!-- Bar chart icon representing financial monitoring -->
  <rect x="80" y="280" width="70" height="152" rx="8" fill="#3b82f6"/>
  <rect x="180" y="200" width="70" height="232" rx="8" fill="#3b82f6"/>
  <rect x="280" y="240" width="70" height="192" rx="8" fill="#f59e0b"/>
  <rect x="380" y="160" width="70" height="272" rx="8" fill="#22c55e"/>
  <!-- Trend line -->
  <polyline points="115,270 215,190 315,230 415,150" stroke="#e2e8f0" stroke-width="12" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Dots on line -->
  <circle cx="115" cy="270" r="10" fill="#e2e8f0"/>
  <circle cx="215" cy="190" r="10" fill="#e2e8f0"/>
  <circle cx="315" cy="230" r="10" fill="#e2e8f0"/>
  <circle cx="415" cy="150" r="10" fill="#e2e8f0"/>
  <!-- Top label bar -->
  <rect x="80" y="60" width="120" height="32" rx="6" fill="#1e40af"/>
  <rect x="220" y="60" width="80" height="32" rx="6" fill="#92400e"/>
  <rect x="320" y="60" width="112" height="32" rx="6" fill="#14532d"/>
</svg>