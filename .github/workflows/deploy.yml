name: deploy

on:
  push:
    branches: [main]
    paths: ['app/**', '.github/workflows/deploy.yml', 'data/sfm-data.json']
  workflow_dispatch:
  workflow_call:  # allows update-data.yml to trigger this after a successful data update

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    # Job-level (también aplica cuando se invoca vía workflow_call desde
    # update-data / update-watchboard, que corren a la misma hora).
    # Sin cancel-in-progress: un deploy en curso termina; el siguiente espera.
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    defaults:
      run:
        working-directory: app
    steps:
      # Punta actual de la rama, no github.sha: cuando lo llama un workflow
      # de datos, github.sha es el commit ANTERIOR al que ese workflow acaba
      # de pushear, y se desplegarían datos viejos.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: app/package-lock.json

      - name: Install
        run: npm ci

      - name: Build
        run: rm -rf dist && npm run build

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: app/dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
