name: Deploy to Cloudflare Pages

on:
  push:
    branches: [main]
    paths:
      - 'app/**'
      - 'data/sfm-data.json'
      - '.github/workflows/deploy-cloudflare.yml'
  workflow_dispatch:
  workflow_call:  # permite que update-data.yml llame este workflow tras actualizar datos

concurrency:
  group: cloudflare-pages
  cancel-in-progress: true

jobs:
  deploy:
    name: Build + deploy to Cloudflare Pages
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: app

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: app/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: rm -rf dist && npm run build

      - name: Resolve project name
        id: project
        run: |
          name="${{ secrets.CLOUDFLARE_PROJECT_NAME }}"
          echo "name=${name:-sfm-monitor}" >> "$GITHUB_OUTPUT"

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/pages-action@v1
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          projectName: ${{ steps.project.outputs.name }}
          directory: app/dist
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}
          wranglerVersion: '3'

# ─── Secrets requeridos en GitHub → Settings → Secrets and variables → Actions ───
#
#   CLOUDFLARE_API_TOKEN      API token de Cloudflare con permiso "Cloudflare Pages: Edit"
#                             (crear en dash.cloudflare.com/profile/api-tokens)
#   CLOUDFLARE_ACCOUNT_ID     Account ID de Cloudflare (dash.cloudflare.com → barra lateral derecha)
#   CLOUDFLARE_PROJECT_NAME   (opcional) Nombre del proyecto en Cloudflare Pages.
#                             Si no se define, se usa el default "sfm-monitor".
#
# ─── El secret GITHUB_TOKEN se provee automáticamente — no hay que configurarlo ───
