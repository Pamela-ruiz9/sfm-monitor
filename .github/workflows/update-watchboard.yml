name: Update Watchboard Data

on:
  schedule:
    - cron: '0 14 * * 1-5'  # 8 AM CDMX (UTC-6) lunes a viernes
  workflow_dispatch:

jobs:
  update-watchboard:
    name: Fetch + commit Watchboard events
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      changed: ${{ steps.commit.outputs.changed }}

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Fetch Watchboard data
        run: python3 scripts/fetch-watchboard.py

      - name: Commit and push if changed
        id: commit
        run: |
          git config user.name "sfm-monitor-bot"
          git config user.email "sfm-monitor@noreply.github.com"
          git add data/watchboard-events.json
          if git diff --staged --quiet; then
            echo "No changes to commit"
            echo "changed=false" >> $GITHUB_OUTPUT
          else
            git commit -m "data: auto-update Watchboard events $(date +%Y-%m-%d)"
            git push
            echo "changed=true" >> $GITHUB_OUTPUT
          fi

  deploy:
    name: Build + deploy app
    needs: update-watchboard
    if: needs.update-watchboard.outputs.changed == 'true' || github.event_name == 'workflow_dispatch'
    uses: ./.github/workflows/deploy.yml
    permissions:
      contents: read
      pages: write
      id-token: write
